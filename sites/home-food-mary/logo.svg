<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e2c8"/>
    </radialGradient>
    <linearGradient id="bread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c06a"/>
      <stop offset="1" stop-color="#c98a2e"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#b0301c" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- a sandwich in house bread -->
  <g stroke="#7a4a0c" stroke-width="2" stroke-linejoin="round">
    <path d="M42 112 q58 -14 116 0 v8 q-58 12 -116 0 z" fill="url(#bread)"/>
    <path d="M40 104 q15 -6 30 0 q15 6 30 0 q15 -6 30 0 q15 6 30 0 v8 q-60 -10 -120 0 z" fill="#5e9a3a"/>
    <path d="M44 100 q56 -10 112 0 v6 q-56 -8 -112 0 z" fill="#c9752e"/>
    <path d="M48 94 q12 -8 24 0 q12 8 24 0 q12 -8 24 0 q12 8 24 0 v6 q-48 -6 -96 0 z" fill="#d8402a"/>
    <path d="M42 92 q0 -36 58 -38 q58 2 58 38 q-58 -8 -116 0 z" fill="url(#bread)"/>
  </g>
  <!-- sesame -->
  <g fill="#fff3d6">
    <ellipse cx="80" cy="70" rx="3" ry="1.6" transform="rotate(-20 80 70)"/>
    <ellipse cx="100" cy="64" rx="3" ry="1.6"/>
    <ellipse cx="120" cy="70" rx="3" ry="1.6" transform="rotate(20 120 70)"/>
    <ellipse cx="92" cy="80" rx="3" ry="1.6" transform="rotate(10 92 80)"/>
    <ellipse cx="110" cy="80" rx="3" ry="1.6" transform="rotate(-10 110 80)"/>
  </g>
  <!-- fries -->
  <g stroke="#a8761a" stroke-width="1.5" fill="#f0c03a">
    <rect x="70" y="128" width="8" height="34" rx="2" transform="rotate(-8 74 145)"/>
    <rect x="84" y="126" width="8" height="38" rx="2"/>
    <rect x="98" y="128" width="8" height="36" rx="2" transform="rotate(6 102 146)"/>
    <rect x="112" y="127" width="8" height="34" rx="2" transform="rotate(12 116 144)"/>
  </g>
  <path d="M64 146 h72 l-8 26 h-56 z" fill="#b0301c" stroke="#8e2514" stroke-width="2" stroke-linejoin="round"/>
  <!-- heart -->
  <path d="M100 160 c-3 -6 -12 -4 -10 3 c1 4 10 9 10 9 c0 0 9 -5 10 -9 c2 -7 -7 -9 -10 -3 z" fill="#fffaf0"/>
