<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f4e2c4"/>
    </radialGradient>
    <linearGradient id="dough" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a94a"/>
      <stop offset="1" stop-color="#a8572a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#9c3d22" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- a clay jachnun pot -->
  <path d="M46 96 h108 l-8 52 q-46 16 -92 0 z" fill="#9c3d22" stroke="#6e2a16" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M40 90 h120 v10 h-120 z" rx="4" fill="#7f2f19" stroke="#6e2a16" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#d99a2b" stroke-width="2.5" stroke-linecap="round">
    <path d="M58 118 l8 -6 l8 6 l8 -6 l8 6 l8 -6 l8 6 l8 -6 l8 6 l8 -6 l8 6"/>
    <path d="M62 132 h76" stroke-dasharray="3 6"/>
  </g>
  <!-- rolled jachnun peeking out -->
  <g stroke="#7a3d14" stroke-width="2">
    <ellipse cx="72" cy="84" rx="16" ry="11" fill="url(#dough)"/>
    <ellipse cx="100" cy="80" rx="17" ry="12" fill="url(#dough)"/>
    <ellipse cx="128" cy="84" rx="16" ry="11" fill="url(#dough)"/>
  </g>
  <g fill="none" stroke="#7a3d14" stroke-width="1.6" stroke-linecap="round">
    <path d="M72 84 m-8 0 a8 6 0 1 1 8 5 a4 3 0 1 1 1 -4"/>
    <path d="M100 80 m-9 0 a9 6.5 0 1 1 9 5.5 a4.5 3 0 1 1 1 -4"/>
    <path d="M128 84 m-8 0 a8 6 0 1 1 8 5 a4 3 0 1 1 1 -4"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#d99a2b" stroke-width="2.5" stroke-linecap="round">
    <path d="M86 58 q-6 -8 0 -16 q6 -8 0 -16"/>
    <path d="M114 58 q-6 -8 0 -16 q6 -8 0 -16"/>
  </g>
  <!-- heart -->
  <path d="M100 160 c-3 -6 -12 -4 -10 3 c1 4 10 9 10 9 c0 0 9 -5 10 -9 c2 -7 -7 -9 -10 -3 z" fill="#d99a2b"/>
