<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="1" stop-color="#d3e5ee"/>
    </radialGradient>
    <linearGradient id="hummus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcae"/>
      <stop offset="1" stop-color="#dfbb7a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#0e5a78" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- pita behind the bowl -->
  <ellipse cx="62" cy="78" rx="30" ry="26" fill="#e9c58b" stroke="#b98740" stroke-width="2" transform="rotate(-20 62 78)"/>
  <!-- bowl -->
  <path d="M42 106 h116 c0 30 -24 50 -58 50 s-58 -20 -58 -50 z" fill="#ffffff" stroke="#0e5a78" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="100" cy="106" rx="58" ry="14" fill="#ffffff" stroke="#0e5a78" stroke-width="3"/>
  <ellipse cx="100" cy="106" rx="49" ry="10" fill="url(#hummus)"/>
  <ellipse cx="100" cy="106" rx="30" ry="5.5" fill="#d79a2b" opacity="0.55"/>
  <!-- chickpeas and parsley -->
  <g fill="#e8c26b" stroke="#b98740" stroke-width="1.2">
    <circle cx="84" cy="102" r="4.5"/><circle cx="98" cy="99" r="4.5"/><circle cx="112" cy="102" r="4.5"/>
  </g>
  <g fill="#4f7a33">
    <ellipse cx="100" cy="106" rx="8" ry="3.4" transform="rotate(-20 100 106)"/>
    <ellipse cx="108" cy="109" rx="7" ry="3" transform="rotate(25 108 109)"/>
  </g>
  <!-- falafel -->
  <g fill="#8a5326" stroke="#5e3716" stroke-width="1.5">
    <circle cx="146" cy="84" r="11"/><circle cx="166" cy="96" r="9"/>
  </g>
  <g fill="#c9894a"><circle cx="143" cy="81" r="2"/><circle cx="149" cy="87" r="1.6"/><circle cx="164" cy="94" r="1.6"/></g>
