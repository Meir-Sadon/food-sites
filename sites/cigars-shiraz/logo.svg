<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#efe1cb"/>
    </radialGradient>
    <linearGradient id="pastry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b45e"/>
      <stop offset="0.55" stop-color="#d48b33"/>
      <stop offset="1" stop-color="#a8621f"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#c8862f" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- three cigars, stacked -->
  <g stroke="#7a4214" stroke-width="2">
    <g transform="rotate(-18 100 100)">
      <rect x="38" y="108" width="112" height="24" rx="12" fill="url(#pastry)"/>
      <ellipse cx="150" cy="120" rx="7" ry="12" fill="#e9b26a"/>
      <ellipse cx="150" cy="120" rx="4" ry="8" fill="#5b2c1c" stroke="none"/>
    </g>
    <g transform="rotate(-18 100 100)">
      <rect x="52" y="82" width="112" height="24" rx="12" fill="url(#pastry)"/>
      <ellipse cx="164" cy="94" rx="7" ry="12" fill="#e9b26a"/>
      <ellipse cx="164" cy="94" rx="4" ry="8" fill="#5b2c1c" stroke="none"/>
    </g>
    <g transform="rotate(-18 100 100)">
      <rect x="44" y="134" width="112" height="24" rx="12" fill="url(#pastry)"/>
      <ellipse cx="156" cy="146" rx="7" ry="12" fill="#e9b26a"/>
      <ellipse cx="156" cy="146" rx="4" ry="8" fill="#5b2c1c" stroke="none"/>
    </g>
  </g>
  <!-- wrap lines -->
  <g fill="none" stroke="#a8621f" stroke-width="1.6" stroke-linecap="round" opacity="0.7" transform="rotate(-18 100 100)">
    <path d="M80 84 L 76 104 M110 84 L 106 104 M140 84 L 136 104"/>
    <path d="M66 110 L 62 130 M96 110 L 92 130 M126 110 L 122 130"/>
    <path d="M72 136 L 68 156 M102 136 L 98 156 M132 136 L 128 156"/>
  </g>
  <!-- parsley -->
  <g fill="#4f7a33">
    <ellipse cx="62" cy="62" rx="9" ry="5" transform="rotate(-35 62 62)"/>
    <ellipse cx="72" cy="52" rx="9" ry="5" transform="rotate(-70 72 52)"/>
    <ellipse cx="52" cy="72" rx="9" ry="5" transform="rotate(5 52 72)"/>
  </g>
  <!-- heart -->
  <path d="M146 44 c -4 -8 -16 -6 -14 4 c 2 6 14 14 14 14 c 0 0 12 -8 14 -14 c 2 -10 -10 -12 -14 -4 z" fill="none" stroke="#5b2c1c" stroke-width="3" stroke-linejoin="round"/>
</svg>
