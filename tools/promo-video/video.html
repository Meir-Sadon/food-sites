<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>promo</title>
<style>
@font-face{font-family:Heebo;font-weight:400;src:url(fonts/heebo-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:700;src:url(fonts/heebo-hebrew-700-normal.woff2)}
@font-face{font-family:Heebo;font-weight:900;src:url(fonts/heebo-hebrew-900-normal.woff2)}
@font-face{font-family:Heebo;font-weight:400;src:url(fonts/heebo-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Heebo;font-weight:700;src:url(fonts/heebo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Heebo;font-weight:900;src:url(fonts/heebo-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
:root{--teal:#0b4a5e;--teal2:#19a7b8;--gold:#ffb703;--coral:#ff5d5d;--green:#2bb673;--ink:#0d2b36;--cream:#fff8ea}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b4a5e;font-family:Heebo,'DejaVu Sans',sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;direction:rtl}
.scene{position:absolute;inset:0;overflow:hidden}
.shape{position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.head{position:absolute;top:70px;left:60px;right:60px;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:84px;line-height:1.05;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.head small{display:block;margin-top:12px;font-size:44px;font-weight:700;color:var(--hl,var(--gold));text-shadow:none}
.head b{color:var(--hl,var(--gold))}
.phone{position:absolute;width:1000px;height:635px;left:40px;top:320px;border-radius:34px;background:#0a1a22;padding:14px;box-shadow:0 50px 100px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.18) inset;transform-origin:50% 100%}
.phone .screen{position:relative;width:972px;height:607px;border-radius:18px;overflow:hidden;background:#fff}
.phone video,.phone img{position:absolute;inset:0;width:972px;height:607px;object-fit:cover;display:none}
.neck{position:absolute;left:465px;top:635px;width:70px;height:56px;background:linear-gradient(#25414d,#0a1a22)}
.base{position:absolute;left:340px;top:688px;width:320px;height:18px;border-radius:10px;background:#0a1a22;box-shadow:0 18px 30px rgba(0,0,0,.3)}
.notch{display:none}
.hcard{position:absolute;left:90px;right:90px;top:1090px;height:420px;border-radius:60px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:34px;padding:30px 50px;box-shadow:0 30px 70px rgba(0,0,0,.3);font-weight:900;font-size:66px;line-height:1.1;text-align:right}
.hcard i{font-style:normal;font-size:170px;line-height:1}
.sticker{position:absolute;font-size:130px;line-height:1;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28))}
.cap{position:absolute;left:50px;right:50px;top:1592px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:4px 12px;direction:rtl;align-content:center;font-weight:900;font-size:62px;line-height:1.14}
.cap span{padding:0 12px;border-radius:18px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.cap span.on{background:var(--gold);color:var(--ink);text-shadow:none}
.brand{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:700;font-size:32px;color:rgba(255,255,255,.85);z-index:5}
.big{position:absolute;text-align:center;left:50px;right:50px;font-weight:900}
.pill{position:absolute;left:90px;right:90px;border-radius:70px;padding:26px 40px;font-weight:900;font-size:50px;line-height:1.1;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.card{position:absolute;width:450px;height:330px;border-radius:50px;background:#fff;color:var(--ink);padding:36px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.card i{display:block;font-style:normal;font-size:120px;line-height:1.1}
.card b{display:block;font-size:52px;line-height:1.1;margin-top:14px;color:var(--teal)}
.ph{position:absolute;border:8px dashed var(--gold);border-radius:60px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:50px;color:#fff;padding:30px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const C = window.CONFIG || { siteName: 'חומוס אל מסרי', phone: '054-6359856', contactName: 'מאיר' };
const S = document.getElementById('stage');
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (cls, html, style, parent) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; if (style) Object.assign(d.style, style); (parent || S).appendChild(d); return d; };
const updaters = [], videos = [], captions = [];
let OFF = 0;
const DUR = 126;

// ---------- captions ----------
const capBox = el('cap', '');
function say(a, b, text) { captions.push({ a: a + OFF, b: b + OFF, words: text.split(' '), text }); }
function renderCaption(t) {
  const c = captions.find((c) => t >= c.a && t < c.b);
  if (!c) { capBox.style.opacity = 0; capBox.dataset.k = ''; return; }
  if (capBox.dataset.k !== c.a + '') { capBox.innerHTML = c.words.map((w) => `<span>${w}</span>`).join(''); capBox.dataset.k = c.a + ''; }
  const n = c.words.length, prog = clamp((t - c.a) / ((c.b - c.a) * 0.9)) * n;
  [...capBox.children].forEach((s, i) => {
    s.className = i === Math.floor(prog) && prog < n ? 'on' : '';
    s.style.opacity = i <= prog ? 1 : 0.18;
    s.style.transform = `translateY(${(1 - ease(prog - i + 0.5)) * 24}px)`;
  });
  capBox.style.opacity = clamp((t - c.a) / 0.2) * clamp((c.b - t) / 0.2);
}

// ---------- scene ----------
function scene(a, b, bg, build) {
  const root = el('scene', '', { background: bg.split('|')[0] });
  if (bg.includes('|')) root.style.setProperty('--hl', bg.split('|')[1]);
  for (let i = 0; i < 5; i++) { const s = 260 + ((i * 137) % 380); el('shape', '', { width: s + 'px', height: s + 'px', left: ((i * 331) % 1100) - 150 + 'px', top: ((i * 521) % 1900) - 120 + 'px' }, root).dataset.k = i; }
  const local = [];
  const api = {
    root,
    on(fn) { local.push(fn); },
    // changing headline: [[t0, t1, html, sub], ...]
    heads(list) {
      const h = el('head', '', null, root);
      this.on((lt) => {
        const cur = list.find((x) => lt >= x[0] && lt < x[1]);
        if (!cur) { h.style.opacity = 0; return; }
        if (h.dataset.k !== cur[0] + '') { h.innerHTML = cur[2] + (cur[3] ? `<small>${cur[3]}</small>` : ''); h.dataset.k = cur[0] + ''; }
        const k = lt - cur[0];
        h.style.opacity = clamp(k / .2) * clamp((cur[1] - lt) / .2);
        h.style.transform = `translateY(${(1 - back(k / .5)) * -70}px) scale(${.9 + .1 * back(k / .5)})`;
      });
    },
    sticker() {},
    cards(list) {
      const c = el('hcard', '', null, root);
      this.on((lt) => {
        const cur = list.find((x) => lt >= x[0] && lt < x[1]);
        if (!cur) { c.style.opacity = 0; return; }
        if (c.dataset.k !== cur[0] + '') { c.innerHTML = `<i>${cur[2]}</i><span>${cur[3]}</span>`; c.dataset.k = cur[0] + ''; }
        const k = lt - cur[0];
        c.style.opacity = clamp(k / .2) * clamp((cur[1] - lt) / .2);
        c.style.transform = `translateY(${(1 - back(k / .55)) * 220}px) scale(${.92 + .08 * back(k / .55)}) rotate(${(1 - back(k / .55)) * 3}deg)`;
      });
    },
    _sticker(emoji, side, y, t0, rot = 0) {
      const s = el('sticker', emoji, { top: y + 'px', [side]: '28px' }, root);
      this.on((lt) => { const k = back((lt - t0) / .6); s.style.opacity = clamp((lt - t0) / .15); s.style.transform = `translateY(${Math.sin(lt * 2 + y) * 14}px) scale(${k}) rotate(${rot + Math.sin(lt * 1.5 + y) * 6}deg)`; });
    },
    // segments: [{clip,from,speed,t0,t1}]
    phone(segments, { at = .2 } = {}) {
      const p = el('phone', '<div class="screen"></div><div class="neck"></div><div class="base"></div>', null, root);
      const sc = p.querySelector('.screen');
      segments.forEach((sg) => {
        const node = document.createElement('video'); node.src = 'clips/' + sg.clip + '.webm'; node.muted = true; node.preload = 'auto'; node.playsInline = true;
        videos.push(node); sc.appendChild(node); sg.node = node;
      });
      this.on((lt) => {
        const k = back((lt - at) / .9);
        p.style.opacity = clamp((lt - at) / .25);
        p.style.transform = `translateY(${(1 - k) * 700}px) rotate(${(1 - k) * -4}deg) scale(${.9 + .1 * k})`;
        segments.forEach((sg) => {
          const on = lt >= sg.t0 && lt < sg.t1;
          sg.node.style.display = on ? 'block' : 'none';
          if (on) sg.node.__target = Math.max(0, (sg.from || 0) + (lt - sg.t0) * (sg.speed || 1));
        });
      });
      return p;
    },
  };
  OFF = a;
  build(api);
  updaters.push((t) => {
    const lt = t - a, vis = t >= a - 0.01 && t < b + 0.45;
    root.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    root.style.clipPath = `circle(${ease(lt / .7) * 1500}px at 50% 55%)`;
    root.style.opacity = t < b ? 1 : clamp(1 - (t - b) / .4);
    [...root.querySelectorAll('.shape')].forEach((s) => { const k = +s.dataset.k; s.style.transform = `translate(${Math.sin(t * .4 + k) * 60}px, ${Math.cos(t * .33 + k * 2) * 80}px) scale(${1 + .08 * Math.sin(t * .6 + k)})`; });
    local.forEach((f) => f(lt, b - a));
  });
}
const TEAL = 'linear-gradient(160deg,#0b4a5e 0%,#127d93 100%)';
const SUN = 'linear-gradient(160deg,#ff9f1c 0%,#ff5d5d 100%)|#0b4a5e';
const MINT = 'linear-gradient(160deg,#0f8b6d 0%,#2bb673 100%)';
const PLUM = 'linear-gradient(160deg,#4a2c82 0%,#e0457b 100%)';
const NAVY = 'linear-gradient(160deg,#10243e 0%,#1f6fb5 100%)';

// ===== 1. hook (0-8) =====
scene(0, 8, TEAL, (s) => {
  s.heads([[0.2, 3.8, 'רוצים שהלקוחות<br><b>יזמינו ישר מהטלפון?</b>'], [3.8, 7.9, 'אתר הזמנות<br><b>לעסק שלכם</b>', C.siteName]]);
  s.phone([{ clip: 'menu', from: 0, speed: .45, t0: 0, t1: 9 }], { at: .5 });
  s.cards([[1.2, 4.2, '📱', 'הלקוחות מזמינים ישר מהטלפון'], [4.2, 7.9, '🧾', 'וההזמנה מגיעה אליכם מסודרת']]);
  say(0.3, 3.7, 'רוצים שהלקוחות יזמינו ישר מהטלפון?');
  say(3.7, 7.8, 'אתר הזמנות לעסק שלכם, בלי לשלם על הפיתוח');
});

// ===== 2. earn together (8-26) =====
scene(8, 26, SUN, (s) => {
  s.heads([[0.1, 17.9, 'התוכנית שלנו:<br><b>מרוויחים ביחד</b>']]);
  const zero = el('big', '0 ₪', { top: '360px', fontSize: '330px', lineHeight: 1, color: '#fff', textShadow: '0 12px 0 rgba(0,0,0,.15)' }, s.root);
  const zl = el('big', 'עלות פיתוח', { top: '690px', fontSize: '90px' }, s.root);
  s.on((lt) => { const k = back((lt - .5) / .8); zero.style.opacity = clamp((lt - .5) / .2); zero.style.transform = `scale(${k})`; zl.style.opacity = ease((lt - 1.2) / .5); zl.style.transform = `translateY(${(1 - ease((lt - 1.2) / .6)) * 60}px)`; });
  const p1 = el('pill', 'משלמים רק <span dir="ltr" style="color:#ff7a00">4%–6%</span> מהמכירות באתר', { top: '850px', background: '#fff', color: '#0d2b36' }, s.root);
  const p2 = el('pill', 'עם תקרה חודשית שנקבעת מראש', { top: '1030px', background: '#0b4a5e', color: '#fff' }, s.root);
  const p3 = el('pill', 'בלי עמלות בלי סוף על כל המכירות', { top: '1200px', background: '#2bb673', color: '#fff' }, s.root);
  [[p1, 4], [p2, 8.6], [p3, 12.4]].forEach(([p, t0]) => s.on((lt) => { const k = back((lt - t0) / .6); p.style.opacity = clamp((lt - t0) / .2); p.style.transform = `translateX(${(1 - k) * 700}px)`; }));
  const meter = el('card', '', { left: '90px', top: '1325px', width: '900px', height: '235px', padding: '26px 40px' }, s.root);
  meter.innerHTML = `<div style="font-weight:900;font-size:40px;color:#0b4a5e;text-align:right">העמלה החודשית</div>
    <div style="position:relative;margin-top:14px;height:50px;border-radius:30px;background:#e4eef1;overflow:hidden"><div id="mb" style="position:absolute;right:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffb703,#ff9f1c);border-radius:30px"></div></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:34px;color:#4a6470;margin-top:10px"><span>התקרה שנקבעה מראש</span><span>עד כאן ולא יותר</span></div>`;
  const mb = meter.querySelector('#mb');
  s.on((lt) => { const k = back((lt - 12.6) / .6); meter.style.opacity = clamp((lt - 12.6) / .2); meter.style.transform = `translateY(${(1 - k) * 300}px)`; mb.style.width = Math.min(100, ease((lt - 13.6) / 2.6) * 100) + '%'; });
  s.sticker('💰', 'left', 480, 1.6, -8); s.sticker('🤝', 'right', 520, 4.6, 8);
  say(0.4, 3.8, 'אפס שקלים עלות פיתוח');
  say(3.8, 8.4, 'משלמים רק ארבעה עד שישה אחוזים מהמכירות באתר');
  say(8.4, 12.4, 'וגם זה עם תקרה חודשית שנקבעת מראש');
  say(12.4, 17.8, 'כשמגיעים לתקרה, העמלה נעצרת');
});

// ===== 3. menu (26-42) =====
scene(26, 42, MINT, (s) => {
  s.heads([[0.1, 15.9, 'התפריט <b>והחיפוש</b>']]);
  s.phone([{ clip: 'menu', from: 1.8, speed: 1.15, t0: 0, t1: 17 }], { at: .3 });
  s.cards([[0.6, 5.3, '📸', 'תפריט עם תמונות ומחירים'], [5.3, 10.6, '🏷️', 'מבצע, חדש או כמעט אזל? מסומן לבד'], [10.6, 15.9, '🔎', 'חיפוש שמוצא מנה תוך שניות']]);
  say(0.3, 5.2, 'תפריט מסודר עם תמונות ומחירים');
  say(5.2, 10.5, 'מבצע, חדש או כמעט אזל? מסומן אוטומטית');
  say(10.5, 15.8, 'והלקוח מוצא מנה בחיפוש תוך שניות');
});

// ===== 4. add-ons (42-58) =====
scene(42, 58, PLUM, (s) => {
  s.heads([[0.1, 15.9, 'תוספות <b>למנה</b>']]);
  s.phone([{ clip: 'addons', from: .8, speed: .92, t0: 0, t1: 17 }], { at: .3 });
  s.cards([[0.6, 5.2, '🫓', 'תוספות לכל מנה: פיתה, ביצה ועוד'], [5.2, 10.6, '🔢', 'אתם קובעים כמה מותר, למשל עד 5'], [10.6, 15.9, '✋', 'הלקוח לא יכול לעבור את הגבול']]);
  say(0.3, 5.2, 'כל מנה יכולה לקבל תוספות, כמו פיתה או ביצה');
  say(5.2, 10.5, 'ואתם קובעים כמה תוספות מותר לקחת בכל מנה');
  say(10.5, 15.8, 'הלקוח רואה כמה נשאר ולא עובר את הכמות');
});

// ===== 5. delivery (58-74) =====
scene(58, 74, NAVY, (s) => {
  s.heads([[0.1, 15.9, 'מחיר משלוח <b>לפי אזור</b>']]);
  s.phone([{ clip: 'zones', from: 1.5, speed: .95, t0: 0, t1: 8.2 }, { clip: 'cart', from: 2.2, speed: 1, t0: 8.2, t1: 17 }], { at: .3 });
  s.cards([[0.6, 4.2, '📍', 'מחיר משלוח שונה לכל אזור'], [4.2, 8.1, '🚫', 'אזור שלא מגיעים אליו אפשר לחסום'], [8.1, 12.2, '🛒', 'הלקוח רואה את דמי המשלוח בעגלה'], [12.2, 15.9, '🎁', 'ובהזמנה גדולה אפשר לתת הנחה']]);
  say(0.3, 4.2, 'מחיר משלוח שונה לכל אזור');
  say(4.2, 8.1, 'ואזור שלא מגיעים אליו אפשר לחסום');
  say(8.1, 12.2, 'הלקוח רואה את דמי המשלוח בעגלה לפני ההזמנה');
  say(12.2, 15.8, 'ובהזמנה גדולה אפשר לתת הנחה על המשלוח');
});

// ===== 6. club (74-90) =====
scene(74, 90, SUN, (s) => {
  s.heads([[0.1, 15.9, 'מועדון <b>לקוחות</b>']]);
  s.phone([{ clip: 'club', from: 1.0, speed: .96, t0: 0, t1: 17 }], { at: .3 });
  s.cards([[0.6, 4.4, '📞', 'נרשמים עם מספר טלפון בלבד'], [4.4, 8.2, '🔓', 'בלי סיסמאות ובלי טפסים ארוכים'], [8.2, 12.6, '📋', 'בפעם הבאה רואים את ההזמנות הקודמות'], [12.6, 15.9, '🔁', 'ומזמינים שוב בלחיצה אחת']]);
  say(0.3, 4.4, 'הלקוחות נרשמים למועדון רק עם מספר טלפון');
  say(4.4, 8.2, 'בלי סיסמאות ובלי טפסים ארוכים');
  say(8.2, 12.6, 'בפעם הבאה הם רואים את ההזמנות הקודמות');
  say(12.6, 15.8, 'ומזמינים שוב בלחיצה אחת');
});

// ===== 7a. admin (90-104) =====
scene(90, 104, TEAL, (s) => {
  s.heads([[0.1, 13.9, 'ניהול <b>פשוט</b>']]);
  s.phone([{ clip: 'admin', from: 1.0, speed: 1.05, t0: 0, t1: 15 }], { at: .3 });
  s.cards([[0.6, 6.9, '🛠️', 'מנהלים מנות, הזמנות ועיצוב לבד'], [6.9, 13.9, '📊', 'ורואים כמה נכנסו וכמה הזמינו']]);
  say(0.3, 6.8, 'מנהלים את האתר לבד, בלי מתכנת');
  say(6.8, 13.8, 'ורואים כמה אנשים נכנסו לאתר וכמה הזמינו');
});

// ===== 7b. more (104-114) =====
const feats = [['📩', 'מייל על כל הזמנה'], ['💳', 'תשלום בביט ובפייבוקס'], ['🔔', 'הודעה שקופצת כשנכנסים'], ['🥗', 'סימון צמחוני וללא גלוטן'], ['📈', 'מעקב לפרסום מדויק'], ['🎨', 'עיצוב שמתאים לעסק']];
scene(104, 114, PLUM, (s) => {
  s.heads([[0.1, 9.9, 'ועוד<br><b>הרבה</b>']]);
  feats.forEach(([ico, txt], i) => {
    const c = el('card', `<i>${ico}</i><b>${txt}</b>`, { left: (i % 2 === 0 ? 555 : 75) + 'px', top: 330 + Math.floor(i / 2) * 370 + 'px' }, s.root);
    s.on((lt) => { const t0 = .6 + i * 1.1, k = back((lt - t0) / .6); c.style.opacity = clamp((lt - t0) / .15); c.style.transform = `scale(${k}) rotate(${(1 - k) * 10}deg)`; });
  });
  say(0.3, 4.8, 'מייל על כל הזמנה, תשלום בביט או בפייבוקס');

});

el('brand', C.siteName + ' · מרוויחים ביחד');

// ---------- master render (async: waits for video seeks) ----------
const seekTo = (v, t) => new Promise((res) => {
  const target = Math.min(t, (v.duration || t) - 0.03);
  if (Math.abs(v.currentTime - target) < 0.004 && v.readyState >= 2) return res();
  const done = () => { v.removeEventListener('seeked', done); res(); };
  v.addEventListener('seeked', done); v.currentTime = target; setTimeout(done, 4000);
});
window.render = async (t) => {
  updaters.forEach((u) => u(t));
  renderCaption(t);
  await Promise.all(videos.filter((v) => v.style.display === 'block' && v.__target != null).map((v) => seekTo(v, v.__target)));
};
window.captions = () => captions.map((c) => ({ a: c.a, b: c.b, text: c.text }));
window.ready = () => Promise.all(videos.map((v) => new Promise((res) => { if (v.readyState >= 2) return res(); v.addEventListener('loadeddata', res); setTimeout(res, 8000); })));
window.DURATION = DUR;
render(0);
</script>
