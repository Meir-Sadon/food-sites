<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>promo</title>
<style>
@font-face{font-family:Heebo;font-weight:400;src:url(fonts/heebo-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:700;src:url(fonts/heebo-hebrew-700-normal.woff2)}

#stage{position:relative;width:1080px;height:1920px;overflow:hidden;direction:rtl}
@font-face{font-family:Heebo;font-weight:400;src:url(fonts/heebo-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-weight:700;src:url(fonts/heebo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-weight:900;src:url(fonts/heebo-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
.blob{position:absolute;border-radius:50%;filter:blur(10px);opacity:.5}
.scene{position:absolute;inset:0;opacity:0}
.head{position:absolute;top:110px;right:70px;left:70px;text-align:center;font-weight:900;font-size:84px;line-height:1.08;color:var(--teal)}
.head small{display:block;font-size:44px;font-weight:700;color:var(--gold);margin-top:10px}
.phone{position:absolute;width:540px;height:1150px;left:270px;top:360px;border-radius:70px;background:#10222b;padding:22px;box-shadow:0 40px 90px rgba(15,90,115,.35)}
.phone .screen{position:relative;width:496px;height:1106px;border-radius:50px;overflow:hidden;background:#fff}
.phone img{position:absolute;top:0;left:0;width:496px;display:block}
.chip{position:absolute;padding:18px 34px;border-radius:60px;font-weight:900;font-size:50px;background:#fff;color:var(--teal);box-shadow:0 14px 40px rgba(18,49,61,.22);white-space:nowrap;border:5px solid var(--gold)}
.chip.g{background:var(--green);color:#fff;border-color:#fff}
.chip.y{background:var(--gold);color:var(--ink);border-color:#fff}
.chip.t{background:var(--teal);color:#fff;border-color:var(--gold)}
.ring{position:absolute;border:8px solid var(--gold);border-radius:30px;box-shadow:0 0 0 8px rgba(217,164,65,.25)}
.cap{position:absolute;left:60px;right:60px;top:1540px;height:270px;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:6px 14px;direction:rtl;align-content:center;font-weight:900;font-size:66px;line-height:1.15}
.cap span{padding:0 12px;border-radius:18px;color:var(--ink);transition:none}
.cap span.on{background:var(--gold);color:var(--ink)}
.brand{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-weight:700;font-size:34px;color:var(--teal);letter-spacing:.5px}
.big{position:absolute;text-align:center;left:60px;right:60px;font-weight:900;color:var(--teal)}
.card{position:absolute;background:#fff;border-radius:46px;box-shadow:0 24px 70px rgba(18,49,61,.2);padding:40px}
.fcard{position:absolute;left:90px;right:90px;top:380px;height:1060px;background:#fff;border-radius:60px;box-shadow:0 30px 90px rgba(18,49,61,.22);overflow:hidden}
.fcard .ico{font-size:200px;text-align:center;margin-top:110px}
.fcard h3{font-size:78px;text-align:center;color:var(--teal);margin:20px 40px 0;font-weight:900;line-height:1.1}

.fcard .shot{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:640px;border-radius:40px 40px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.25);display:block}
.ph{position:absolute;left:290px;width:500px;height:500px;top:880px;border:8px dashed var(--gold);border-radius:60px;background:#fffdf5;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:50px;color:#8a6a1e;padding:30px}

<body>
<div id="stage"></div>
<script>
const C = window.CONFIG || { siteName: 'חומוס אל מסרי', phone: '054-6359856', contactName: 'מאיר', shots: 'shots/' };
const S = document.getElementById('stage');
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (cls, html, style, parent = S) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; if (style) Object.assign(d.style, style); parent.appendChild(d); return d; };
const shot = (n) => C.shots + n + '.png';
const updaters = [];
const DUR = 126;

// background blobs
const blobs = [[-200, 100, 700, '#bfe3ee'], [650, 900, 640, '#f6e3b4'], [-100, 1500, 600, '#f6e3b4'], [700, -150, 520, '#bfe3ee']].map(([x, y, s, c]) => el('blob', '', { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px', background: c }));
el('brand', C.siteName + ' · מרוויחים ביחד');

// ---------- captions ----------
const capBox = el('cap', '');
const captions = [];
let OFF = 0;
function say(a, b, text) { captions.push({ a: a + OFF, b: b + OFF, words: text.split(' ') }); }
function renderCaption(t) {
  const c = captions.find((c) => t >= c.a && t < c.b);
  if (!c) { capBox.style.opacity = 0; capBox.dataset.k = ''; return; }
  const k = c.a + '';
  if (capBox.dataset.k !== k) { capBox.innerHTML = c.words.map((w) => `<span>${w}</span>`).join(''); capBox.dataset.k = k; }
  const n = c.words.length;
  const prog = clamp((t - c.a) / ((c.b - c.a) * 0.88)) * n;
  [...capBox.children].forEach((s, i) => {
    s.className = i === Math.floor(prog) && prog < n ? 'on' : '';
    s.style.opacity = i <= prog ? 1 : 0.12;
    s.style.transform = `translateY(${(1 - ease(prog - i + 0.4)) * 20}px)`;
  });
  capBox.style.opacity = clamp((t - c.a) / 0.25) * clamp((c.b - t) / 0.25);
}

// ---------- scene helper ----------
function scene(a, b, build) {
  const root = el('scene', '');
  const local = [];
  const api = {
    root,
    on(fn) { local.push(fn); },
    head(html, sub) { const h = el('head', html + (sub ? `<small>${sub}</small>` : ''), null, root); this.on((lt) => { h.style.opacity = ease(lt / .5); h.style.transform = `translateY(${(1 - back(lt / .6)) * -60}px)`; }); return h; },
    phone(img, { scroll = 0, at = 0.2, x = 270, y = 360, pan = 0 } = {}) {
      const p = el('phone', `<div class="screen"><img src="${shot(img)}"></div>`, { left: x + 'px', top: y + 'px' }, root);
      const im = p.querySelector('img');
      this.on((lt) => { const k = back((lt - at) / .8); p.style.opacity = clamp((lt - at) / .3); p.style.transform = `translateY(${(1 - k) * 400}px) scale(${.9 + .1 * k})`; im.style.transform = `translateY(${-(scroll + pan * clamp((lt - at - .6) / 4))}px)`; });
      p.swap = (src, t0) => { p.dataset.sw = t0; p.src2 = src; };
      return p;
    },
    chip(text, cls, x, y, t0, rot = 0) { const c = el('chip ' + cls, text, { left: x + 'px', top: y + 'px' }, root); this.on((lt) => { const k = back((lt - t0) / .5); c.style.opacity = clamp((lt - t0) / .15); c.style.transform = `scale(${k}) rotate(${rot}deg)`; }); return c; },
    ring(x, y, w, h, t0, t1) { const r = el('ring', '', { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }, root); this.on((lt) => { const pul = 1 + .04 * Math.sin(lt * 6); r.style.opacity = clamp((lt - t0) / .2) * clamp((t1 - lt) / .2); r.style.transform = `scale(${pul})`; }); return r; },
  };
  OFF = a;
  build(api);
  updaters.push((t) => {
    const lt = t - a, dur = b - a;
    const vis = t >= a - 0.01 && t < b + 0.4;
    root.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    root.style.opacity = clamp(lt / .35) * (t < b ? 1 : clamp(1 - (t - b) / .4));
    local.forEach((f) => f(lt, dur));
  });
}

// ===== 1. hook (0-8) =====
scene(0, 8, (s) => {
  s.head('רוצים אתר הזמנות<br>לעסק שלכם?');
  s.phone('home', { at: .6 });
  s.chip(C.siteName, 't', 130, 1180, 1.6, -4);
  s.chip('בלי עמלות בלי סוף', 'y', 420, 520, 3.4, 4);
  say(0.3, 3.6, 'רוצים אתר הזמנות לעסק שלכם?');
  say(3.6, 7.8, 'אתר מלא, כמו של הגדולים, בלי לשלם על הפיתוח');
});

// ===== 2. earn together (8-26) =====
scene(8, 26, (s) => {
  s.head('מרוויחים ביחד', 'התוכנית שלנו');
  const zero = el('big', '0 ₪', { top: '470px', fontSize: '300px', lineHeight: 1, color: 'var(--gold)' }, s.root);
  const zl = el('big', 'עלות פיתוח', { top: '800px', fontSize: '84px' }, s.root);
  s.on((lt) => { const k = back((lt - .3) / .7); zero.style.opacity = clamp((lt - .3) / .2); zero.style.transform = `scale(${k})`; zl.style.opacity = ease((lt - 1) / .5); });
  const c = el('card', `
    <div style="font-weight:900;font-size:50px;text-align:center;color:var(--teal)">הוצאות האתר: רק <span dir="ltr">4%–6%</span> מהמכירות</div>
    <svg id="gr" viewBox="0 0 800 380" style="width:100%;height:290px;margin-top:6px;overflow:visible">
      <line x1="40" y1="340" x2="780" y2="340" stroke="#9fb3bb" stroke-width="4"/>
      <line x1="40" y1="120" x2="780" y2="120" stroke="#c0392b" stroke-width="5" stroke-dasharray="14 12"/>
      <text x="780" y="95" text-anchor="start" font-size="40" font-weight="900" fill="#c0392b" style="direction:rtl" text-anchor="end">תקרה חודשית</text>
      <polyline id="gs" fill="none" stroke="#1b7f9e" stroke-width="10" stroke-linecap="round" points=""/>
      <polyline id="gc" fill="none" stroke="#d9a441" stroke-width="14" stroke-linecap="round" points=""/>
      <text x="60" y="60" font-size="36" font-weight="700" fill="#1b7f9e">מכירות</text>
      <text x="150" y="400" font-size="36" font-weight="700" fill="#b9851e">העמלה שלנו</text>
    </svg>
    <div style="font-weight:900;font-size:46px;text-align:center;color:var(--green);margin-top:6px">עד גבול שנקבע מראש, ולא מעבר</div>`,
    { left: '70px', top: '930px', width: '940px', height: '590px', padding: '30px 40px', overflow: 'hidden' }, s.root);
  const gs = c.querySelector('#gs'), gc = c.querySelector('#gc');
  s.on((lt) => {
    c.style.opacity = ease((lt - 3.2) / .5); c.style.transform = `translateY(${(1 - ease((lt - 3.2) / .8)) * 120}px)`;
    const p = clamp((lt - 4) / 8); let a = '', b = '';
    for (let i = 0; i <= 40 * p; i++) { const x = 40 + (740 * i) / 40, u = i / 40; const sales = 340 - 250 * Math.pow(u, 1.1); a += `${x},${sales} `; const com = 340 - Math.min(360 * Math.pow(u, 1.1), 220); b += `${x},${Math.max(com, 120)} `; }
    gs.setAttribute('points', a); gc.setAttribute('points', b);
  });
  say(0.4, 3.8, 'אפס שקלים עלות פיתוח');
  say(3.8, 9.8, 'כל הוצאות האתר: רק 4% עד 6% מהמכירות');
  say(9.8, 17.8, 'עם תקרה חודשית שנקבעת מראש, ולא עמלות בלי סוף');
});

// ===== 3. menu (26-40) =====
scene(26, 40, (s) => {
  s.head('תפריט שמוכר', 'חיפוש חכם, מבצעים ותגיות');
  const p = s.phone('dishes', { scroll: 0 });
  const p2 = s.phone('search', { at: 5 });
  s.chip('חדש', 'g', 100, 760, 1.4, -6);
  s.chip('מבצע', 'y', 100, 880, 2, 5);
  s.chip('כמעט אזל', 'y', 100, 1000, 2.6, -4);
  s.chip('חיפוש עם הדגשה', 't', 80, 640, 5.8, -5);
  s.chip('תגיות תזונה', 'g', 600, 1180, 8.5, 5);
  s.chip('קטגוריות בלחיצה', 't', 90, 1300, 10, -4);
  s.on((lt) => { p.style.display = lt > 4.9 ? 'none' : 'block'; });
  say(0.3, 4.8, 'תפריט מסודר עם תמונות, מבצעים ומנות חדשות');
  say(4.8, 9.4, 'חיפוש חכם שמדגיש את מה שהלקוח הקליד');
  say(9.4, 13.8, 'וגם כמעט אזל, תגיות תזונה וקפיצה בין קטגוריות');
});

// ===== 4. add-ons (40-54) =====
scene(40, 54, (s) => {
  s.head('תוספות למנה', 'עם הגבלת כמות');
  const p = s.phone('addon', { at: .3 });
  const p2 = s.phone('addon2', { at: 5.5 });
  s.on((lt) => { p.style.display = lt > 5.4 ? 'none' : 'block'; });
  s.ring(330, 720, 440, 100, 2.2, 5.3);
  s.chip('עד 5 תוספות', 'y', 90, 660, 2.4, -5);
  s.chip('לכל מנה בנפרד', 't', 500, 960, 3.8, 5);
  s.chip('הלקוח מתאים בעצמו', 'g', 90, 1280, 7, -4);
  s.chip('נשאר: 5 מתוך 5', 'y', 520, 700, 8.5, 5);
  say(0.3, 4.4, 'כל מנה יכולה לקבל תוספות, כמו פיתה או ביצה');
  say(4.4, 9.2, 'ואתם קובעים כמה תוספות מותר לכל מנה');
  say(9.2, 13.8, 'הלקוח רואה כמה נשאר ולא יכול לעבור את הגבול');
});

// ===== 5. delivery (54-70) =====
scene(54, 70, (s) => {
  s.head('מחיר משלוח', 'לפי אזור');
  // stylised zone map
  const map = el('card', `
    <svg viewBox="0 0 800 800" style="width:100%;height:100%">
      <rect x="0" y="0" width="800" height="800" rx="40" fill="#eaf4f7"/>
      <path d="M40 700 C200 600 330 760 500 660 S760 600 760 470 L760 760 L40 760Z" fill="#cfe7f0"/>
      <circle id="z3" cx="400" cy="400" r="330" fill="#c0392b" fill-opacity=".14" stroke="#c0392b" stroke-width="6" stroke-dasharray="16 12"/>
      <circle id="z2" cx="400" cy="400" r="215" fill="#d9a441" fill-opacity=".28" stroke="#b9851e" stroke-width="7"/>
      <circle id="z1" cx="400" cy="400" r="110" fill="#2e7d4f" fill-opacity=".35" stroke="#2e7d4f" stroke-width="7"/>
      <text x="400" y="395" text-anchor="middle" font-size="44" font-weight="900" fill="#12313d">${C.siteName}</text>
      <text x="400" y="445" text-anchor="middle" font-size="44">📍</text>
      <text id="t1" x="400" y="320" text-anchor="middle" font-size="40" font-weight="900" fill="#2e7d4f">₪15</text>
      <text id="t2" x="400" y="225" text-anchor="middle" font-size="40" font-weight="900" fill="#8a6a1e">₪25</text>
      <text id="t3" x="400" y="130" text-anchor="middle" font-size="40" font-weight="900" fill="#c0392b">אין משלוח</text>
    </svg>`, { left: '90px', top: '360px', width: '900px', height: '900px', padding: '30px' }, s.root);
  const q = (id) => map.querySelector(id);
  s.on((lt) => {
    map.style.opacity = ease(lt / .5); map.style.transform = `scale(${.9 + .1 * back(lt / .8)})`;
    [['#z3', 1.2], ['#z2', 2.4], ['#z1', 3.6]].forEach(([id, t0]) => { const k = back((lt - t0) / .7); const e = q(id); e.style.transformOrigin = '400px 400px'; e.style.transform = `scale(${k})`; e.style.opacity = clamp((lt - t0) / .2); });
    [['#t1', 4.2], ['#t2', 3.1], ['#t3', 1.9]].forEach(([id, t0]) => { q(id).style.opacity = ease((lt - t0 - .4) / .4); });
  });
  const cart = s.phone('cart', { at: 8.9 });
  s.on((lt) => { cart.style.display = lt > 8.8 ? 'block' : 'none'; map.style.display = lt > 8.9 ? 'none' : 'block'; if (lt > 8.4) map.style.opacity = clamp((8.9 - lt) / .4); });
  s.chip('הנחה על משלוח בהזמנה גדולה', 'g', 100, 1290, 11.4, -3);
  s.chip('חסימת אזורים', 'y', 560, 1260, 10, 4);
  say(0.3, 4.4, 'מחיר משלוח שונה לכל אזור, על גבי מפה');
  say(4.4, 8.8, 'אזור רחוק עולה יותר, ואזורים שלא מגיעים אליהם נחסמים');
  say(8.8, 15.6, 'הלקוח רואה את הסכום בעגלה, כולל הנחה על הזמנה גדולה');
});

// ===== 6. customer club (70-86) =====
scene(70, 86, (s) => {
  s.head('מועדון לקוחות', 'הרשמה קלה והזמנה חוזרת');
  const a = s.phone('login', { at: .3 });
  const b = s.phone('login2', { at: 4.4 });
  s.on((lt) => { a.style.display = lt > 4.3 ? 'none' : 'block'; });
  s.chip('רק מספר טלפון', 'y', 90, 640, 1.6, -5);
  s.chip('בלי סיסמה', 't', 650, 760, 2.4, 5);
  s.chip('נרשם אוטומטית', 'g', 90, 1000, 6.2, -4);
  const rep = el('card', `<div style="font-size:44px;font-weight:700;color:#6b7f88">ההזמנה האחרונה שלך</div>
    <div style="font-size:56px;font-weight:900;color:var(--teal);margin-top:6px">חומוס נטו + תוספת פיתה</div>
    <div style="margin-top:22px;background:var(--teal);color:#fff;border-radius:60px;padding:26px 40px;font-size:60px;font-weight:900;text-align:center">⟳ הזמן שוב בלחיצה</div>`,
    { left: '80px', top: '1120px', width: '920px', height: '330px', padding: '36px 44px' }, s.root);
  s.on((lt) => { const k = back((lt - 9.6) / .6); rep.style.opacity = clamp((lt - 9.6) / .2); rep.style.transform = `translateY(${(1 - k) * 200}px)`; });
  say(0.3, 4.6, 'לקוחות נרשמים למועדון רק עם מספר טלפון');
  say(4.6, 9.6, 'בלי סיסמאות ובלי טפסים ארוכים');
  say(9.6, 15.6, 'והזמנה חוזרת, או מועדפים, זה לחיצה אחת');
});

// ===== 7. more (86-114): feature cards =====
const feats = [
  ['🖥️', 'ניהול פשוט', 'תפריט צד, מנות, קטגוריות והזמנות במקום אחד', 'admin-settings'],
  ['🔔', 'חלון קופץ בכניסה', 'מבצעים והודעות מהאתר, ללא מתכנת', 'admin-popup'],
  ['📊', 'דוח שימוש באתר', 'כמה נכנסו, כמה התחילו הזמנה וכמה הזמינו', 'admin-usage'],
  ['🎨', 'עיצוב לבחירתכם', 'סגנון, צבעים וכפתורים שמתאימים לעסק', 'admin-appearance'],
  ['📩', 'מייל על כל הזמנה', 'ההזמנה מגיעה אליכם מסודרת, בכל רגע', 'admin-orders'],
  ['💳', 'תשלום ב־Bit ו־PayBox', 'קישור לתשלום ישירות בהזמנה', null],
  ['📈', 'פיקסל מעקב לפרסום', 'מטא, גוגל וטיקטוק לפרסום חכם', null],
];
scene(86, 114, (s) => {
  s.head('ועוד המון', 'כלים שבעל עסק צריך');
  feats.forEach(([ico, h, p, img], i) => {
    const t0 = i * 4, c = el('fcard', `<div class="ico">${ico}</div><h3>${h}</h3><p>${p}</p>${img ? `<img class="shot" src="${shot(img)}">` : ''}`, null, s.root);
    s.on((lt) => { const lk = lt - t0; c.style.display = lk > -.3 && lk < 4.3 ? 'block' : 'none'; const k = back(lk / .6); c.style.opacity = clamp(lk / .25) * clamp((4.1 - lk) / .25); c.style.transform = `translateX(${(1 - k) * -500}px) rotate(${(1 - k) * -6}deg)`; });
  });
  say(0.3, 4.0, 'מנהלים הכול ממקום אחד, בתפריט צד נוח');
  say(4.0, 8.0, 'חלון קופץ בכניסה לאתר לפרסום מבצעים');
  say(8.0, 12.0, 'דוח שימוש שמראה כמה לקוחות נכנסו והזמינו');
  say(12.0, 16.0, 'ועיצוב באתר שמותאם לעסק שלכם');
  say(16.0, 20.0, 'מייל על כל הזמנה חדשה');
  say(20.0, 24.0, 'תשלום ב־Bit או ב־PayBox');
  say(24.0, 27.8, 'ופיקסל מעקב לפרסום ממומן');
});

// ===== 8. outro (114-126) =====
scene(114, 126, (s) => {
  const t = el('big', 'מרוויחים<br>ביחד', { top: '170px', fontSize: '170px', lineHeight: 1 }, s.root);
  const sub = el('big', '0 ₪ פיתוח · <span dir="ltr">4%–6%</span> מהמכירות · עם תקרה חודשית', { top: '560px', fontSize: '50px', color: 'var(--ink)' }, s.root);
  const ph = el('card', `<div style="font-size:50px;font-weight:700;color:#6b7f88;text-align:center">דברו איתי</div><div style="font-size:80px;font-weight:900;color:var(--teal);text-align:center;margin-top:4px">${C.contactName}</div><div dir="ltr" style="font-size:96px;font-weight:900;color:var(--gold);text-align:center;line-height:1.1">${C.phone}</div>`, { left: '70px', top: '720px', width: '940px', height: '330px', padding: '34px' }, s.root);
  const q = el('ph', 'מקום שמור<br>לקישור / ברקוד<br>לדף נחיתה', { top: '1100px', height: '400px', width: '400px', left: '340px' }, s.root);
  s.on((lt) => {
    t.style.opacity = ease(lt / .5); t.style.transform = `scale(${.8 + .2 * back(lt / .8)})`;
    sub.style.opacity = ease((lt - .8) / .5);
    const k = back((lt - 1.6) / .6); ph.style.opacity = clamp((lt - 1.6) / .2); ph.style.transform = `translateY(${(1 - k) * 160}px)`;
    const k2 = back((lt - 2.6) / .6); q.style.opacity = clamp((lt - 2.6) / .2); q.style.transform = `scale(${k2})`;
  });
  say(0.4, 4.6, 'מרוויחים ביחד, אפס שקלים פיתוח');
  say(4.6, 11.6, 'דברו איתי ונקים לעסק שלכם אתר הזמנות בקלות');
});

// ---------- master render ----------
window.render = (t) => {
  blobs.forEach((b, i) => { b.style.transform = `translate(${Math.sin(t * .35 + i) * 40}px, ${Math.cos(t * .3 + i * 2) * 50}px)`; });
  updaters.forEach((u) => u(t));
  renderCaption(t);
  document.querySelectorAll('.cap').forEach((c) => { c.style.display = (t > 113.9 && false) ? 'none' : 'flex'; });
};
window.DURATION = DUR;
render(0);
</script>
