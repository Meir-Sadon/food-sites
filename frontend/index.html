<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      // Paint the look the admin chose from the first frame: the last /api/site look (see site/themeCache.ts)
      // is applied before the page renders, so the site.json colours never show first. Client pages only.
      // With no saved look (a first visit) the page stays hidden until /api/site has answered and ClientLayout has
      // applied the look (it removes #theme-pending); the timer lets the page show anyway if that never happens.
      try {
        if (!/^\/(admin|d)(\/|$)/.test(location.pathname)) {
          var theme = JSON.parse(localStorage.getItem('foodSiteTheme'))
          if (theme) {
            var root = document.documentElement
            for (var name in theme.vars) root.style.setProperty(name, theme.vars[name])
            for (var key in theme.attrs) root.dataset[key] = theme.attrs[key]
          } else {
            var pending = document.createElement('style')
            pending.id = 'theme-pending'
            pending.textContent = 'html{background:#fff}body{visibility:hidden}'
            document.head.appendChild(pending)
            setTimeout(function () { pending.remove() }, 4000)
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
