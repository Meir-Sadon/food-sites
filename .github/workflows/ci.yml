name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Change these with the Phase 1 rename (docs/MIGRATION-PLAN.md).
  SOLUTION: backend/FoodSite.slnx
  API_PROJECT: backend/src/FoodSite.Api

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Site folders (scripts/check-sites.mjs)
        run: node ../scripts/check-sites.mjs
      - run: npm run lint
      - name: Build every site (also the typecheck)
        run: for site in $(ls ../sites); do echo "::group::$site"; SITE=$site npm run build; echo "::endgroup::"; done
      - run: npm test

  backend:
    name: Backend (build, test, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore "$SOLUTION"
      - run: dotnet build "$SOLUTION" --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: dotnet test "$SOLUTION" --no-build -c Release
      - name: Model snapshot matches the entities
        env:
          # Design-time only: Program.cs needs these to start, nothing connects.
          Jwt__Secret: ci-design-time-secret-at-least-32-characters
          Site__Id: ci
          ConnectionStrings__Default: Host=localhost;Database=ci;Username=ci;Password=ci
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project "$API_PROJECT" --no-build --configuration Release

  sites:
    name: List sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "sites=$(ls sites | grep -vxE "_template|_shared" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    name: Production image (${{ matrix.site }})
    needs: sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    steps:
      - uses: actions/checkout@v5
      - run: docker build --file Dockerfile --build-arg SITE=${{ matrix.site }} --tag food-site-${{ matrix.site }}:ci .
