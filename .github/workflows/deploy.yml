# Staged rollout (docs/DEPLOY.md). After CI passes on main, this deploys the canary through its
# Render deploy hook, waits until its /api/health reports that commit, then deploys every other
# site through its own deploy hook at the same commit. Every service has Render's auto-deploy off:
# with "After CI checks pass", Render would also wait for this workflow's own check, which waits
# for Render, so nothing would ever deploy.
#
# Setup: repository variable CANARY_URL (e.g. https://kuskus-shel-ima.onrender.com), secret
# RENDER_DEPLOY_HOOK_CANARY (the canary's deploy hook) and one secret per other site, named in
# the matrix below. Without CANARY_URL the workflow does nothing.
#
# Which sites deploy is chosen in GitHub, with no pull request: repository variable DEPLOY_SITES,
# site ids separated by spaces (e.g. "kuskus-shel-ima kuskus-liel"). Empty or missing: every site.
# Any other word, e.g. "none": nothing deploys. CANARY_SITE (default kuskus-shel-ima) is the site
# the canary job deploys; if it is not listed the canary is skipped and the listed sites deploy
# without waiting for it. Secrets of sites that are not listed stay untouched.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  # A newer commit supersedes a rollout still waiting on the canary.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    name: Deploy the canary
    if: vars.CANARY_URL != '' && (vars.DEPLOY_SITES == '' || contains(format(' {0} ', vars.DEPLOY_SITES), format(' {0} ', vars.CANARY_SITE || 'kuskus-shel-ima'))) && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Trigger the canary's deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CANARY }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Secret RENDER_DEPLOY_HOOK_CANARY is not set."; exit 1; fi
          curl -fsS -X POST "$HOOK&ref=$SHA" > /dev/null
      - name: Canary reports ${{ steps.sha.outputs.sha }}
        env:
          URL: ${{ vars.CANARY_URL }}/api/health
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # A free service may be asleep; each request also wakes it.
          for i in $(seq 1 50); do
            commit=$(curl -fsS --max-time 60 "$URL" | jq -r '.commit // empty' || true)
            echo "attempt $i: canary runs ${commit:-unknown}"
            [ "$commit" = "$SHA" ] && exit 0
            sleep 30
          done
          echo "::error::The canary did not report $SHA. The other sites were not deployed."
          exit 1

  sites:
    name: Deploy ${{ matrix.site }}
    needs: canary
    # Runs after a skipped canary too (not listed in DEPLOY_SITES), never after a failed one.
    if: always() && vars.CANARY_URL != '' && needs.canary.result != 'failure' && needs.canary.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One line per non-canary site: its folder and the secret holding its deploy hook.
          - site: grape-leaves-eliel
            hook: RENDER_DEPLOY_HOOK_GRAPE_LEAVES
          - site: cigars-shiraz
            hook: RENDER_DEPLOY_HOOK_CIGARS_SHIRAZ
          - site: kuskus-liel
            hook: RENDER_DEPLOY_HOOK_KUSKUS_LIEL
          - site: home-food-mary
            hook: RENDER_DEPLOY_HOOK_HOME_FOOD_MARY
          - site: fish-trays-rephael
            hook: RENDER_DEPLOY_HOOK_FISH_TRAYS_REPHAEL
          - site: yemeni-dishes-sapir
            hook: RENDER_DEPLOY_HOOK_YEMENI_DISHES_SAPIR
          - site: hummus-el-masri
            hook: RENDER_DEPLOY_HOOK_HUMMUS_EL_MASRI
          - site: house-delicacies
            hook: RENDER_DEPLOY_HOOK_HOUSE_DELICACIES
          - site: salads-cohen
            hook: RENDER_DEPLOY_HOOK_SALADS_COHEN
          - site: ron-burger
            hook: RENDER_DEPLOY_HOOK_RON_BURGER
    steps:
      - name: Trigger the deploy hook
        # matrix is not available in a job-level if, so the DEPLOY_SITES choice is made here.
        if: vars.DEPLOY_SITES == '' || contains(format(' {0} ', vars.DEPLOY_SITES), format(' {0} ', matrix.site))
        env:
          HOOK: ${{ secrets[matrix.hook] }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Secret ${{ matrix.hook }} is not set; ${{ matrix.site }} was not deployed."; exit 0; fi
          curl -fsS -X POST "$HOOK&ref=$SHA" > /dev/null
          echo "Deploy of ${{ matrix.site }} at $SHA requested."
