# Local development stack: `SITE=<folder under sites/> docker compose up --build`, then open http://localhost:8080
# (without SITE it runs sites/_template).
# Admin area: http://localhost:8080/admin  (dev user name and password: "admin")
#
# The defaults below are for local use only. Override them in a .env file next to this one
# (POSTGRES_PASSWORD, JWT_SECRET, ADMIN_PASSWORD_HASH, CLOUDINARY_URL).
name: food-sites

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodsite
      POSTGRES_USER: foodsite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodsite}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodsite -d foodsite"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SITE: ${SITE:-_template}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=foodsite;Username=foodsite;Password=${POSTGRES_PASSWORD:-foodsite}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      # The owner (user name "admin"): hash of "admin". Only copied into Settings when the database has no owner password yet.
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:-AQAAAAIAAYagAAAAECliO1aVr/omJHp1yMHPeanrqq/pzJemPc8qU8AbIJI77Ic4Lf8NWIbyv+Eu5UVwBQ==}
      # The master admin (user name "master"): empty turns its login off.
      Admin__MasterPasswordHash: ${ADMIN_MASTER_PASSWORD_HASH:-}
      Database__MigrateOnStartup: "true"
      ForwardedHeaders__Enabled: "true"
      # The local stack is plain HTTP.
      AuthCookie__Secure: "false"
      # cloudinary://<api_key>:<api_secret>@<cloud_name>. Without it, picture uploads are switched off.
      Cloudinary__Url: ${CLOUDINARY_URL:-}
      WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WhatsApp__Token: ${WHATSAPP_TOKEN:-}
    ports:
      - "5000:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE: ${SITE:-_template}
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  pgdata:
