# Render Blueprint: one free web service per site, all built from the same Dockerfile.
# A service's SITE picks its folder under sites/; Render passes it to the Dockerfile as a build argument.
# Each service has its own Neon database and secrets. Step-by-step instructions are in docs/DEPLOY.md.
#
# Staged rollout: every service has auto-deploy off. After CI passes on main,
# .github/workflows/deploy.yml deploys the canary (first service) through its deploy hook,
# then the others once the canary's /api/health reports the new commit.

services:
  # Canary
  - type: web
    name: kuskus-shel-ima
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: SITE
        value: kuskus-shel-ima
      # Npgsql format, e.g. Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false
      # The site owner's first password. Output of: dotnet run --project backend/src/FoodSite.Api -- hash-password '<password>'
      - key: Admin__PasswordHash
        sync: false
      # The master admin: the same two values on every service (see docs/DEPLOY.md, "Master admin")
      - key: Admin__MasterUsername
        sync: false
      - key: Admin__MasterPasswordHash
        sync: false
      # cloudinary://<api_key>:<api_secret>@<cloud_name>; empty disables picture uploads
      - key: Cloudinary__Url
        sync: false
      # Both empty: WhatsApp messages are only logged
      - key: WhatsApp__Token
        sync: false
      - key: WhatsApp__PhoneNumberId
        sync: false
      # TextMe account for SMS order confirmations; empty: SMS is only logged.
      # Sms__Source is the sender name the client sees (up to 11 English letters or digits, verified at TextMe).
      - key: Sms__Username
        sync: false
      - key: Sms__Token
        sync: false
      - key: Sms__Source
        sync: false
      # Optional: this site's own message text, e.g. "{siteName}: הזמנה #{orderId} התקבלה, סה״כ ₪{total}"
      - key: Sms__ConfirmationTemplate
        sync: false
      # A Resend API key turns on mail to the business owner (new orders, changes); empty: no mail
      - key: Mail__ResendApiKey
        sync: false
      # Or a Brevo API key (used instead of Resend when set), with Mail__From a sender address verified in Brevo
      - key: Mail__BrevoApiKey
        sync: false
      - key: Mail__From
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      # This site's menu already lives in its database; the seed would re-add dishes renamed since.
      - key: Database__ApplySeeds
        value: "false"
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: AuthCookie__SameSite
        value: Lax
      - key: PORT
        value: "8080"

